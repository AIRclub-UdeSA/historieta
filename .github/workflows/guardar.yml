name: guardar

on:
  repository_dispatch:
    types: [imagen-nueva]
  workflow_dispatch:
    inputs:
      datos:
        description: "JSON con {repo,num,tipo,autor,fecha,url,imagenes:[{src,alt}]}"
        required: true

# Un guardado a la vez, para que dos comentarios seguidos no choquen al hacer push.
concurrency:
  group: guardar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guardar:
    runs-on: ubuntu-latest
    steps:
      # main está protegida: solo la App airclub-historieta puede pushear directo (excepción del ruleset).
      - name: Token de la App para escribir en historieta
        id: escritura
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.HISTORIETA_APP_ID }}
          private-key: ${{ secrets.HISTORIETA_APP_PRIVATE_KEY }}
          repositories: historieta
          permission-contents: write
      - uses: actions/checkout@v5
        with:
          token: ${{ steps.escritura.outputs.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Descargar y archivar
        env:
          GH_TOKEN: ${{ github.token }}
          DATOS: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload.datos) || inputs.datos }}
        run: node scripts/guardar.mjs "$DATOS"
      - name: Commit
        env:
          ORIGEN: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.datos.url || 'carga manual' }}
        run: |
          git config user.name "airclub-historieta[bot]"
          git config user.email "339344225+airclub-historieta[bot]@users.noreply.github.com"
          git add archivo data
          git diff --cached --quiet && exit 0
          git commit -m "archivo: imágenes de $ORIGEN"
          git pull --rebase
          git push
